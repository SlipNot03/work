<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JWT Auth</title>
</head>
<body>
    <div id="userInfo" style="display:none">
        <p>Добро пожаловать <span id="userName"></span></p>
        <input type="submit" id="submitData" value="Hello">
        <input type="submit" id="submitLogout" value="Выйти">
    </div>
    <div id="loginForm">
        <h3>Вход</h3>
        <p>
            <label>Email</label>
            <input type="email" id="email" />
        </p>
        <p>
            <label>Пароль</label>
            <input type="password" id="password" />
        </p>
        <input type="submit" id="submitLogin" value="Логин">
    </div>
    <script>
        document.getElementById("submitLogin").addEventListener("click", async e => {
            e.preventDefault();
            const response = await fetch("/login", {
                method: "POST",
                headers: { Accept: "application/json", "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            });
            if (response.ok) {
                const data = await response.json();
                document.getElementById("userName").innerText = data.username;
                document.getElementById("userInfo").style.display = "block";
                document.getElementById("loginForm").style.display = "none";
                sessionStorage.setItem("jwt-token", data.accessToken)
            } else {
                console.log("status: ", response.statusText);
            }
        });

        document.getElementById("submitData").addEventListener("click", async e => {
            e.preventDefault();
            var token = sessionStorage.getItem("jwt-token");
            const response = await fetch("/hello", {
                method: "GET",
                headers: {
                    Accept: "application/json",
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },

            });
            if (response.ok) {
                const data = await response.json();
                alert(data.message);
            } else {
                console.log("status: ", response.statusText);
            }

        });
        document.getElementById("submitLogout").addEventListener("click", async e => {
            e.preventDefault();
            document.getElementById("userName").innerText = '';
            document.getElementById("userInfo").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
            sessionStorage.removeItem("jwt-token");
        });
    </script>
</body>
</html>
